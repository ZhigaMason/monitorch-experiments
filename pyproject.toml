[project]
name = "monitorch-experiments"
version = "0.0.0.1"
readme = "README.md"
authors = [
  { name = "Maksym Khavil", email = "mk.khavil@gmail.com" }
]
keywords = [
        "pytorch",
        "visualization",
        "neural networks",
        "gradients"
]
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
requires-python = ">=3.11"

dependencies = [
    "torch>=2.0.0",
    "monitorch",
    "jupyter>=1.1.1",
    "python-dotenv[cli] ~= 1.2.2",
    "kaggle >= 1.8.0",
    "jupyter >= 1.1.1",
    "torchvision>=0.26.0",
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
    "scipy>=1.17.1",
]

[tool.ruff]
ignore = ["E402"]
